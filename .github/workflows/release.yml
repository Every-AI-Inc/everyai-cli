name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance (publishConfig.provenance: true).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships npm 10.x,
      # which detects OIDC but cannot exchange the token (fails ENEEDAUTH).
      # Pinned to 11.x: npm@latest is 12.x and requires Node 22+.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      # Opens/updates the "Version Packages" PR, and publishes with provenance
      # when a release is ready. Publishing is gated on the NPM_TOKEN secret —
      # absent for now, so no publish happens until it is configured.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
